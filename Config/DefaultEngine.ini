[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/DungeonPrototype
GameDefaultMap=/Game/Maps/DungeonPrototype
GlobalDefaultGameMode=/Script/NUthEck.DungeonPrototypeGameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Virtual Shadow Maps require SM6. The engine's inherited SM5 target silently
; falls back to conventional shadows, which lose detail in the overhead view.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.AntiAliasingMethod=2
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=1

[/Script/Engine.Engine]
bSmoothFrameRate=False
GameViewportClientClassName=/Script/NUthEck.DungeonGameViewportClient

[SystemSettings]
; Full-level views make individual tiles small; retain their shadow casters.
r.Shadow.Virtual.NonNanite.UseRadiusThreshold=0
r.Shadow.RadiusThreshold=0
